volumes:
  redis-data:
  redis-insight-data:
  sqlite-data:
  floci-data:

networks:
  app-network:
    driver: bridge

services:
  redis-infra:
    image: redis
    restart: always
    networks:
      - app-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis-insight:
    image: redis/redisinsight:latest
    networks:
      - app-network
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis-infra

  bull:
    image: venatum/bull-board:latest
    networks:
      - app-network
    ports:
      - "4000:3000"
    environment:
      - REDIS_HOST=redis-infra
      - REDIS_PORT=6379
    depends_on:
      redis-infra:
        condition: service_healthy

  floci:
    image: floci/floci
    networks:
      - app-network
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      - FLOCI_HOSTNAME=floci
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_MAX_REQUEST_SIZE=100000000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data

  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
      target: dev
    container_name: server
    networks:
      - app-network
    environment:
      - PORT=3000
      - REDIS_HOST=redis-infra
      - REDIS_PORT=6379
      - DATABASE_URL=/monorepo/data/test.db
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_ACCESS_KEY_ID=floci
      - AWS_SECRET_ACCESS_KEY=floci
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "3000:3000"
    depends_on:
      redis-infra:
        condition: service_healthy
    volumes:
      - .:/monorepo
      - /monorepo/node_modules
      - /monorepo/apps/server/node_modules
      - sqlite-data:/monorepo/data

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
      target: dev
    container_name: worker
    networks:
      - app-network
    environment:
      - NODE_OPTIONS=--max-old-space-size=5120
      - REDIS_HOST=redis-infra
      - REDIS_PORT=6379
      - DATABASE_URL=/app/data/test.db
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_ACCESS_KEY_ID=floci
      - AWS_SECRET_ACCESS_KEY=floci
      - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      redis-infra:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - sqlite-data:/app/data
